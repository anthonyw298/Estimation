name: Auto Release main.py

on:
  push:
    tags:
      - 'v*.*.*'  # Trigger on tags like v1.0.0

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # Needed for checkout and release actions

    steps:
      # Checkout the repository
      - uses: actions/checkout@v4

      # Create or update the release and upload main.py
      - name: Create or Update Release with main.py
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          update: true
          files: main.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
