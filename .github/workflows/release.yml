name: Auto Release main.py

# Trigger workflow only on new tags
on:
  push:
    tags:
      - 'v*.*.*'  # e.g., v1.0.0

permissions:
  contents: write   # allows pushing/updating files
  packages: write   # optional, if you need packages
  releases: write   # explicitly allows creating/updating releases

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      # Checkout the repository
      - uses: actions/checkout@v3

      # Create or update the GitHub release
      - name: Create or Update Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          allowUpdates: true       # Allows updating if release already exists
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Upload main.py to the release
      - name: Upload main.py
        uses: softprops/action-gh-release@v1
        with:
          files: main.py           # Path relative to repo root
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
