name: Auto Release main.exe

# Trigger workflow on new tags
on:
  push:
    tags:
      - 'v*.*.*'  # e.g., v1.0.0

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # Needed for checkout and release actions

    steps:
      # 1. Checkout the repository
      - uses: actions/checkout@v4

      # 2. Set up Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      # 3. Install dependencies
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      # 4. Build executable with PyInstaller
      - name: Build main.exe
        run: pyinstaller --onefile main.py

      # 5. Create or update the GitHub release and upload main.exe
      - name: Create or Update Release with main.exe
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: dist/main.exe   # PyInstaller outputs here
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

