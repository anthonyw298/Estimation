name: Auto Release main.py

on:
  push:
    tags:
      - 'v*.*.*'  # e.g., v1.0.0

permissions:
  contents: write   # For checking out the repo
  releases: write   # For creating/updating releases and uploading assets

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      # Checkout the repository
      - uses: actions/checkout@v4  # Updated to latest version

      # Create release and upload main.py
      - name: Create Release and Upload main.py
        uses: softprops/action-gh-release@v2  # Use latest version
        with:
          tag_name: ${{ github.ref_name }}
          update: true  # Allows updating existing release
          files: main.py  # Path to main.py in repo root
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}